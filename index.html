<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<titl>The skill tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Skill Tree</h1>
  <div class="stats">
    <div class="stat"><b id="spores">0</b><span>Unités</span></div>
    <div class="stat"><b id="cps">0</b><span>par seconde</span></div>
  </div>
</header>
<main>
  <div class="gather">
    <button id="gather">Génerer quelque chose ?</button>
    <span id="msg"></span>
  </div>
  <div class="tree-wrap"><div id="tree"><svg id="links" aria-hidden="true"></svg></div></div>
  <footer>
    <button class="ghost" id="save">Sauvegarder</button>
    <button class="ghost" id="reset">Réinitialiser</button>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
